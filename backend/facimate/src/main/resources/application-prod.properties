spring.application.name=facimate
server.port=${PORT}

#database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.timezone=Asia/Manila

#frontend url
frontend.url=${FRONTEND_URL}

#api integration
teams.webhook.url=${TEAMS_WEBHOOK_URL}

# Logging
logging.level.root=INFO
logging.level.com.ita11.backend=DEBUG